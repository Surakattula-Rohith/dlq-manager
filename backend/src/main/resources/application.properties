# ========================================
# APPLICATION INFO
# ========================================
# Every value below can be overridden with an environment variable (defaults match docker-compose.yml)
spring.application.name=DLQ Manager
server.port=${SERVER_PORT:8080}

# Configure Hibernate to use UTC timezone for consistent timestamp handling
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ========================================
# DATABASE CONFIGURATION (PostgreSQL)
# ========================================
# Connection URL - points to postgres container
# Timezone parameter ensures consistent UTC handling across database connections
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dlqmanager?user.timezone=UTC&TimeZone=UTC}
spring.datasource.username=${DB_USERNAME:dlquser}
spring.datasource.password=${DB_PASSWORD:dlqpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / HIBERNATE CONFIGURATION
# ========================================
# Automatically create/update database tables from Entity classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console - off by default, turn on with SHOW_SQL=true when debugging
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL specific dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# KAFKA CONFIGURATION
# ========================================
# Default Kafka broker address (used until one is saved from the Settings page)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer configuration
spring.kafka.consumer.group-id=dlq-manager-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ========================================
# JACKSON CONFIGURATION
# ========================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ========================================
# LOGGING
# ========================================
# Set LOG_LEVEL=DEBUG for detailed app logs
logging.level.com.dlqmanager=${LOG_LEVEL:INFO}
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
