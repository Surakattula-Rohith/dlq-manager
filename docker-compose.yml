services:
  # Kafka Broker - Where DLQ messages live
  # Runs in KRaft mode (Kafka manages its own metadata), so no ZooKeeper is needed
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dlq-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      # localhost:9092 for apps on your machine, kafka:29092 for other containers
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Any fixed id works for a single local broker
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped
    networks:
      - dlq-network

  # PostgreSQL - Database for storing DLQ metadata, replay history
  postgres:
    image: postgres:15
    container_name: dlq-postgres
    environment:
      POSTGRES_USER: dlquser
      POSTGRES_PASSWORD: dlqpass
      POSTGRES_DB: dlqmanager
    ports:
      # Use POSTGRES_PORT=5433 (for example) if 5432 is already taken on your machine
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlquser -d dlqmanager"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - dlq-network

# Named volumes for data persistence
volumes:
  postgres-data:
    driver: local

# Network for all services to communicate
networks:
  dlq-network:
    driver: bridge
